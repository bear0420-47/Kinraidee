steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runtime
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - --file
      - src/api/Dockerfile
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: kinraidee
  _IMAGE_NAME: kinraidee-api
  _IMAGE_TAG: manual
