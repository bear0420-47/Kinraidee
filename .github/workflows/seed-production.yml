name: Seed production catalog

# Manual only. Never runs on push. The seed upserts the catalog in one transaction
# (it rolls back on any failure) and soft-deletes records listed only in the archived
# catalog. It runs catalog-only, so it reads no administrator secret and never changes
# the administrator account.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "seed production" to confirm the human approved this run'
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: kinraidee-512615

jobs:
  seed:
    name: Seed catalog
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.confirm == 'seed production' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/354890476527/locations/global/workloadIdentityPools/github-actions/providers/kinraidee-main
          service_account: kinraidee-deployer@kinraidee-512615.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api prisma generate

      - name: Check the catalog seed is up to date
        run: pnpm --filter api catalog:build --check

      - name: Apply migrations and seed
        working-directory: src/api
        shell: bash
        run: |
          set -euo pipefail
          direct_url="$(gcloud secrets versions access latest --secret=DIRECT_DATABASE_URL)"
          echo "::add-mask::$direct_url"
          export DATABASE_URL="$direct_url" DIRECT_DATABASE_URL="$direct_url"
          export SEED_CATALOG_ONLY=true NODE_ENV=production LOCAL_UPLOADS_ENABLED=false
          pnpm prisma migrate deploy
          pnpm prisma db seed
