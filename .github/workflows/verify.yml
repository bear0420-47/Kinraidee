name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    name: Validate workflow evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            doc/rule.md
            doc/plan.md
            doc/REVIEW.md
            doc/verification.md
            .docs/01-requirements/intent.md
            .docs/01-requirements/backlog.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          for file in .github/agents/*.agent.md templates/*.template.md; do
            test -f "$file" || { echo "Missing workflow asset: $file"; exit 1; }
          done
          specs=(.docs/01-requirements/01-spec/*.md)
          test -f "${specs[0]}" || { echo "Missing current requirement specification"; exit 1; }
          grep -q 'Do not write application code until' AGENTS.md
          grep -q 'doc/rule.md' AGENTS.md
          grep -Eqi 'approved|approval' .docs/01-requirements/intent.md
          grep -Eqi 'approved|approval' "${specs[0]}"
          grep -Eqi 'approved|approval' doc/plan.md
          grep -q 'Sign-off' doc/verification.md
          grep -q 'Decision' doc/REVIEW.md
      - name: Validate custom-agent frontmatter
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/agents/*.agent.md; do
            head -n 1 "$file" | grep -q '^---$'
            grep -q '^name:' "$file"
            grep -q '^description:' "$file"
          done

  node:
    name: Build, test, and lint
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present
      - name: Lint
        run: npm run lint --if-present
