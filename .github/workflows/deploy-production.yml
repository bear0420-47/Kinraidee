name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: kinraidee-512615
  REGION: asia-southeast1
  REPOSITORY: kinraidee
  IMAGE_NAME: kinraidee-api
  SERVICE_NAME: kinraidee-api
  RUNTIME_SERVICE_ACCOUNT: kinraidee-api-runtime@kinraidee-512615.iam.gserviceaccount.com
  FIREBASE_ORIGIN: https://kinraidee-512615.web.app

jobs:
  deploy:
    name: Deploy API and web
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/354890476527/locations/global/workloadIdentityPools/github-actions/providers/kinraidee-main
          service_account: kinraidee-deployer@kinraidee-512615.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push API image
        run: |
          gcloud builds submit . \
            --config=cloudbuild.api.yaml \
            --substitutions=_REGION="$REGION",_REPOSITORY="$REPOSITORY",_IMAGE_NAME="$IMAGE_NAME",_IMAGE_TAG="$GITHUB_SHA" \
            --quiet

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        working-directory: src/api
        shell: bash
        run: |
          set -euo pipefail
          migration_url="$(gcloud secrets versions access latest --secret=DIRECT_DATABASE_URL)"
          DATABASE_URL="$migration_url" \
            DIRECT_DATABASE_URL="$migration_url" \
            pnpm prisma migrate deploy

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --min=0 \
            --max=2 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=20 \
            --timeout=30s \
            --set-env-vars="NODE_ENV=production,LOCAL_UPLOADS_ENABLED=false,CORS_ALLOWED_ORIGINS=$FIREBASE_ORIGIN,EXTERNAL_PROVIDER_TIMEOUT_MS=5000,GEMINI_MODEL=gemini-3.5-flash-lite" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest" \
            --quiet

      - name: Build web
        env:
          VITE_API_BASE_URL: ${{ env.FIREBASE_ORIGIN }}
        run: pnpm --filter web build

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@15.34.1 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$FIREBASE_ORIGIN/" >/dev/null
          curl --fail --silent --show-error "$FIREBASE_ORIGIN/meal" >/dev/null
          curl --fail --silent --show-error "$FIREBASE_ORIGIN/api/zones" >/dev/null
