<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img"
     aria-label="Kinraidee UML use case diagram: Meal Seeker and Data Administrator actors with use cases inside the Kinraidee system boundary">
  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#B26A00" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <style>
      .lbl   { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill:#1F2933; }
      .uc    { font-size:13px; text-anchor:middle; }
      .actor { font-size:13.5px; font-weight:700; text-anchor:middle; }
      .sys   { font-size:13px; font-weight:700; fill:#5A6472; text-anchor:middle;
               letter-spacing:.08em; }
      .rel   { font-size:11.5px; fill:#B26A00; font-style:italic; text-anchor:middle; }
      .leg   { font-size:11.5px; fill:#5A6472; }
      .assoc { stroke:#4A5568; stroke-width:1.4; fill:none; }
      .incl  { stroke:#B26A00; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
      .oval  { fill:#FFFFFF; stroke:#3E7CB1; stroke-width:1.7; }
      .core  { fill:#E4F1EE; stroke:#2A9D8F; stroke-width:2.4; }
      .fig   { stroke:#2A9D8F; stroke-width:2; fill:none; stroke-linecap:round; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#FFFFFF"/>

  <!-- system boundary -->
  <rect x="250" y="20" width="630" height="500" rx="6" fill="none" stroke="#C7CDD6" stroke-width="1.6"/>
  <text class="lbl sys" x="565" y="44">KINRAIDEE</text>

  <!-- ============ actors ============ -->
  <!-- Meal Seeker -->
  <g class="fig">
    <circle cx="140" cy="200" r="11" fill="#FFFFFF"/>
    <line x1="140" y1="211" x2="140" y2="245"/>
    <line x1="122" y1="224" x2="158" y2="224"/>
    <line x1="140" y1="245" x2="126" y2="268"/>
    <line x1="140" y1="245" x2="154" y2="268"/>
  </g>
  <text class="lbl actor" x="140" y="288">Meal Seeker</text>

  <!-- Data Administrator -->
  <g class="fig">
    <circle cx="140" cy="440" r="11" fill="#FFFFFF"/>
    <line x1="140" y1="451" x2="140" y2="485"/>
    <line x1="122" y1="464" x2="158" y2="464"/>
    <line x1="140" y1="485" x2="126" y2="508"/>
    <line x1="140" y1="485" x2="154" y2="508"/>
  </g>
  <text class="lbl actor" x="140" y="528">Data Administrator</text>

  <!-- ============ use cases ============ -->
  <ellipse class="core" cx="400" cy="110" rx="105" ry="32"/>
  <text class="lbl uc" x="400" y="108" font-weight="700">Get a meal shortlist</text>
  <text class="lbl uc" x="400" y="125" font-size="11" fill="#2A9D8F" font-weight="700">core</text>

  <ellipse class="oval" cx="400" cy="198" rx="105" ry="32"/>
  <text class="lbl uc" x="400" y="203">Reject and replace a choice</text>

  <ellipse class="oval" cx="400" cy="286" rx="105" ry="32"/>
  <text class="lbl uc" x="400" y="281">Choose at random from</text>
  <text class="lbl uc" x="400" y="297">filtered results</text>

  <ellipse class="oval" cx="400" cy="374" rx="105" ry="32"/>
  <text class="lbl uc" x="400" y="369">Edit conditions /</text>
  <text class="lbl uc" x="400" y="385">start a new session</text>

  <ellipse class="oval" cx="400" cy="482" rx="105" ry="32"/>
  <text class="lbl uc" x="400" y="477">Administer restaurant</text>
  <text class="lbl uc" x="400" y="493">and menu records</text>

  <ellipse class="oval" cx="740" cy="110" rx="100" ry="32"/>
  <text class="lbl uc" x="740" y="115">Enter session conditions</text>

  <ellipse class="oval" cx="740" cy="482" rx="100" ry="32"/>
  <text class="lbl uc" x="740" y="487">Authorize the operation</text>

  <!-- ============ associations (plain solid, no arrowhead) ============ -->
  <line class="assoc" x1="162" y1="228" x2="295" y2="110"/>
  <line class="assoc" x1="162" y1="230" x2="295" y2="198"/>
  <line class="assoc" x1="162" y1="238" x2="295" y2="286"/>
  <line class="assoc" x1="162" y1="242" x2="295" y2="374"/>
  <line class="assoc" x1="162" y1="470" x2="295" y2="482"/>

  <!-- ============ include (dashed, open arrowhead toward included UC) ============ -->
  <line class="incl" x1="505" y1="110" x2="636" y2="110" marker-end="url(#openArrow)"/>
  <text class="lbl rel" x="570" y="101">&#171;include&#187;</text>

  <line class="incl" x1="505" y1="482" x2="636" y2="482" marker-end="url(#openArrow)"/>
  <text class="lbl rel" x="570" y="473">&#171;include&#187;</text>

  <line class="incl" x1="400" y1="166" x2="400" y2="146" marker-end="url(#openArrow)"/>
  <text class="lbl rel" x="462" y="160">&#171;include&#187;</text>

  <path class="incl" d="M 505,278 C 585,258 585,158 432,137" marker-end="url(#openArrow)"/>
  <text class="lbl rel" x="600" y="215">&#171;include&#187;</text>

  <!-- ============ legend ============ -->
  <line class="assoc" x1="252" y1="556" x2="292" y2="556"/>
  <text class="lbl leg" x="300" y="560">association</text>
  <line class="incl" x1="392" y1="556" x2="432" y2="556" marker-end="url(#openArrow)"/>
  <text class="lbl leg" x="442" y="560">&#171;include&#187; &#8212; base use case includes the target</text>
</svg>
